<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psalm 144</title>
<style>
  :root{ --ink:#0d0f10; --paper:#f4f2ee; --muted:#8b8f93; --line:#23282b; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scrim{position:absolute;inset:0;background:
     linear-gradient(180deg,rgba(13,15,16,.42) 0%,rgba(13,15,16,.10) 40%,rgba(13,15,16,.60) 100%)}

  /* logo, top left */
  .brand{position:absolute;top:clamp(20px,3vw,40px);left:clamp(20px,3vw,40px);
    width:clamp(54px,6vw,86px);opacity:.95;filter:drop-shadow(0 2px 14px rgba(0,0,0,.7))}

  /* centred watermark: in on load, gone by five seconds */
  .watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(34vw,380px);pointer-events:none;opacity:0;
    filter:drop-shadow(0 2px 24px rgba(0,0,0,.55));
    animation:wm 5s ease-out forwards}
  @keyframes wm{ 0%{opacity:0} 10%{opacity:.30} 45%{opacity:.30} 100%{opacity:0} }

  /* wordmark along the bottom of the video */
  .wordmark{position:absolute;left:0;right:0;bottom:clamp(24px,4vh,48px);text-align:center;
    font-size:clamp(13px,1.6vw,18px);letter-spacing:.42em;text-transform:uppercase;
    font-weight:600;color:var(--paper);text-shadow:0 2px 18px rgba(0,0,0,.75)}

  .contact{padding:clamp(64px,10vw,140px) clamp(20px,4vw,48px);text-align:center;
    border-top:1px solid var(--line)}
  .contact h2{font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    margin:0 0 1.1em;font-weight:500}
  .contact a{color:var(--paper);text-decoration:none;border-bottom:1px solid #3a4145;
    font-size:clamp(20px,3vw,30px);padding-bottom:.12em}
  .contact a:hover{border-bottom-color:var(--paper)}
  @media (prefers-reduced-motion:reduce){ .watermark{animation:none;opacity:0} }
</style>
</head>
<body>
  <div class="hero">
    <video autoplay muted loop playsinline preload="auto" src="hero.mp4"></video>
    <div class="scrim"></div>
    <img class="brand" src="logo-white.png" alt="Psalm 144">
    <img class="watermark" src="logo-white.png" alt="">
    <div class="wordmark">Psalm 144</div>
  </div>

  <section class="contact">
    <h2>Contact</h2>
    <a href="mailto:Jesse@psalm144.co.uk">Jesse@psalm144.co.uk</a>
  </section>
</body>
</html>
