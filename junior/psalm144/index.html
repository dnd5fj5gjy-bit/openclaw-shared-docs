<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psalm 144</title>
<style>
  :root{ --ink:#0d0f10; --paper:#f4f2ee; --muted:#8b8f93; --line:#23282b;
         --foot:clamp(24px,4vh,48px); }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scrim{position:absolute;inset:0;background:
     linear-gradient(180deg,rgba(13,15,16,.34) 0%,rgba(13,15,16,.10) 40%,rgba(13,15,16,.62) 100%)}

  /* logo: large on load, settles small just above the wordmark and stays there */
  .mark{position:absolute;left:50%;bottom:calc(var(--foot) + 34px);
    width:clamp(56px,7vw,86px);pointer-events:none;
    transform-origin:center bottom;transform:translateX(-50%);
    filter:drop-shadow(0 3px 20px rgba(0,0,0,.65));
    animation:settle 5.5s cubic-bezier(.5,0,.25,1) forwards}
  @keyframes settle{
    0%   {transform:translate(-50%,-22vh) scale(3.8);opacity:0}
    5%   {transform:translate(-50%,-22vh) scale(3.8);opacity:1}
    100% {transform:translate(-50%,0) scale(1);opacity:1}
  }
  @media (prefers-reduced-motion:reduce){ .mark{animation:none} }

  .wordmark{position:absolute;left:0;right:0;bottom:var(--foot);text-align:center;
    font-size:clamp(13px,1.6vw,18px);letter-spacing:.42em;text-transform:uppercase;
    font-weight:600;color:var(--paper);text-shadow:0 2px 18px rgba(0,0,0,.75)}

  .contact{padding:clamp(64px,10vw,140px) clamp(20px,4vw,48px);text-align:center;
    border-top:1px solid var(--line)}
  .contact a{color:var(--paper);text-decoration:none;border-bottom:1px solid #3a4145;
    font-size:clamp(16px,2vw,22px);letter-spacing:.24em;text-transform:uppercase;
    font-weight:500;padding-bottom:.35em}
  .contact a:hover{border-bottom-color:var(--paper)}
</style>
</head>
<body>
  <div class="hero">
    <video autoplay muted loop playsinline preload="auto" src="hero.mp4"></video>
    <div class="scrim"></div>
    <img class="mark" src="logo-white.png" alt="Psalm 144">
    <div class="wordmark">Psalm 144</div>
  </div>

  <section class="contact">
    <a href="mailto:Jesse@psalm144.co.uk">Contact</a>
  </section>
</body>
</html>
